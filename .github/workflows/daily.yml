name: Daily NSE Picks

# Runs Mon-Fri at 11:30 UTC == 17:00 IST (5pm IST).
# NOTE: GitHub Actions cron is UTC-only and best-effort (can be delayed a few
# minutes under load). This is fine for an end-of-day positional job.
on:
  schedule:
    - cron: "30 11 * * 1-5"
  workflow_dispatch: {} # allow manual "Run workflow" from the Actions tab

# Needed so the job can commit the updated ledger back to the repo.
permissions:
  contents: write

concurrency:
  group: daily-picks
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run daily analysis + notify + ledger update
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm start

      - name: Commit updated ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ledger.json
          if git diff --staged --quiet; then
            echo "No ledger changes to commit."
          else
            git commit -m "chore(ledger): daily update [skip ci]"
            git push
          fi
